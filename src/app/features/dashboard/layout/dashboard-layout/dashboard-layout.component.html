<div class="flex h-screen overflow-hidden bg-gray-50">

  <!-- Overlay para móvil -->
  @if (isSidebarOpen()) {
    <div
      (click)="closeSidebar()"
      class="fixed inset-0 z-40 bg-gray-600/75 transition-opacity md:hidden cursor-pointer"
      aria-hidden="true">
    </div>
  }

  <!-- Contenedor del Sidebar responsivo (deslizable en móvil, estático en desktop) -->
  <div
    class="fixed inset-y-0 left-0 z-50 w-64 transform md:transform-none bg-white transition-transform duration-300 ease-in-out md:relative md:translate-x-0 flex-shrink-0"
    [class.-translate-x-full]="!isSidebarOpen()"
    [class.translate-x-0]="isSidebarOpen()">
    <side-bar (linkClicked)="closeSidebar()" (modalStateChange)="onModalStateChange($event)"/>
  </div>

  <!-- Contenedor Principal -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">

    <header class="bg-white border-b border-gray-200 px-4 md:px-8 py-3 md:py-4 sticky top-0 z-10 flex-shrink-0">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button
            type="button"
            (click)="toggleSidebar()"
            class="p-2 -ml-2 rounded-lg text-gray-600 hover:bg-gray-100 md:hidden cursor-pointer focus:outline-none"
            aria-label="Abrir menú">
            <lucide-icon [img]="icons.Menu" class="w-6 h-6"></lucide-icon>
          </button>
          <h1 class="text-xl md:text-2xl font-bold text-gray-900 truncate">
            {{ pageTitle() }}
          </h1>
        </div>
        <div class="flex items-center gap-4 flex-shrink-0">
          <button class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer">
            <lucide-icon [img]="icons.Bell" class="w-5 h-5 text-gray-600"></lucide-icon>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 w-full overflow-y-auto">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>

<loading-modal
  [status]="modalState().status"
  [message1]="modalState().title"
  [message2]="modalState().subtitle">
</loading-modal>
