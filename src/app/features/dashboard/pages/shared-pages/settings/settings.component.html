<div class="p-4 sm:p-6 md:p-8 space-y-6 max-w-5xl mx-auto">

  <div class="bg-white rounded-xl border border-gray-200 p-1.5 sm:p-2 flex overflow-x-auto whitespace-nowrap scrollbar-hide gap-1 sm:gap-2 w-full sm:w-auto sm:inline-flex">
    <button
      (click)="setTab('profile')"
      [class.bg-yellow-600]="activeTab() === 'profile'"
      [class.text-white]="activeTab() === 'profile'"
      [class.text-gray-700]="activeTab() !== 'profile'"
      class="flex-1 sm:flex-initial text-center px-4 sm:px-6 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm md:text-base font-medium transition-colors hover:bg-gray-100 cursor-pointer"
    >
      Perfil
    </button>
    <button
      (click)="setTab('stats')"
      [class.bg-yellow-600]="activeTab() === 'stats'"
      [class.text-white]="activeTab() === 'stats'"
      [class.text-gray-700]="activeTab() !== 'stats'"
      class="flex-1 sm:flex-initial text-center px-4 sm:px-6 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm md:text-base font-medium transition-colors hover:bg-gray-100 cursor-pointer"
    >
      Estadísticas
    </button>
    <button
      (click)="setTab('preferences')"
      [class.bg-yellow-600]="activeTab() === 'preferences'"
      [class.text-white]="activeTab() === 'preferences'"
      [class.text-gray-700]="activeTab() !== 'preferences'"
      class="flex-1 sm:flex-initial text-center px-4 sm:px-6 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm md:text-base font-medium transition-colors hover:bg-gray-100 cursor-pointer"
    >
      Preferencias
    </button>
  </div>

  @if (userRole() === 'maestro') {
    <settings-teacher
      [activeTab]="activeTab()"
      [user]="userData()"
    >
    </settings-teacher>
  }
  @if (userRole() === 'alumno') {
    <settings-student
      [activeTab]="activeTab()"
      [user]="userData()"
    >
    </settings-student>
  }
</div>
