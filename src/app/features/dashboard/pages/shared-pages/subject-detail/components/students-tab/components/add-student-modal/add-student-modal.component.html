@if (isModalOpen()) {
  <!-- Fondo oscuro semitransparente (Backdrop) -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm transition-opacity"
  (click)="closeModal.emit()">

  <!-- Contenedor del Modal (stopPropagation evita que un clic aquí cierre el modal) -->
  <div
    class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 overflow-hidden"
    (click)="$event.stopPropagation()">

    <!-- Header del Modal -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 bg-gray-50">
      <h3 class="text-lg font-bold text-gray-900">Añadir Estudiante</h3>
      <button
        (click)="closeModal.emit()"
        class="text-gray-400 hover:text-gray-600 transition-colors rounded-lg p-1 hover:bg-gray-200">
        <!-- Icono X -->
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Cuerpo del Modal -->
    <div class="p-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Buscar por Correo Electrónico
      </label>

      <div class="flex gap-2 mb-4">
        <div class="relative flex-1">
          <!-- Icono Search -->
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input
            type="email"
            [(ngModel)]="searchEmail"
            (keyup.enter)="searchStudent()"
            placeholder="ejemplo@correo.com"
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition-all"
          />
        </div>
        <button
          (click)="searchStudent()"
          [disabled]="isSearching() || !searchEmail()"
          class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 disabled:bg-gray-400 transition-colors font-medium flex items-center gap-2">
          @if (isSearching()) {
            <!-- Spinner simple -->
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          }
          Buscar
        </button>
      </div>

      <!-- Estado: Error -->
      @if (searchError()) {
        <div class="p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200">
          {{ searchError() }}
        </div>
      }

      <!-- Estado: Estudiante Encontrado -->
      @if (foundStudent()) {
        <div class="mt-4 p-4 border border-green-200 bg-green-50 rounded-lg">
          <p class="text-xs font-semibold text-green-800 uppercase tracking-wider mb-2">Estudiante Encontrado</p>
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center border border-green-200 shadow-sm">
              <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div>
              <p class="font-bold text-gray-900">{{ foundStudent()?.name }}</p>
              <p class="text-sm text-gray-600">{{ foundStudent()?.email }}</p>
            </div>
          </div>

          <button
            (click)="onAddStudent()"
            class="w-full py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition-colors font-medium flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            Inscribir a la Materia
          </button>
        </div>
      }
    </div>
  </div>
</div>

}
