@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm transition-opacity">

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-md w-full mx-4 overflow-hidden transform transition-all border border-transparent dark:border-gray-700">

      <div class="p-6 sm:p-8">

        <div class="flex items-center gap-4 mb-4">
          <div class="flex-shrink-0 w-12 h-12 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center">
            <svg class="w-6 h-6 text-yellow-600 dark:text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <h3 class="text-xl font-bold text-gray-900 dark:text-gray-100">
            {{ title() }} </h3>
        </div>

        <p class="text-gray-600 dark:text-gray-300 text-base">
          {{ message() }} </p>

        @if (itemName()) {
          <div class="mt-4 p-3 bg-red-50 dark:bg-red-900/20 rounded-lg border border-red-100 dark:border-red-800/40">
            <p class="text-sm text-red-800 dark:text-red-300 font-semibold truncate">
              {{ itemName() }}
            </p>
          </div>
        }
      </div>

      <div class="bg-gray-50 dark:bg-gray-750 px-6 py-4 flex justify-end gap-3 sm:px-8 border-t border-gray-100 dark:border-gray-700">
        <button
          (click)="onCancel()"
          class="px-5 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors cursor-pointer"
        >
          Cancelar
        </button>
        <button
          (click)="onConfirm()"
          class="px-5 py-2.5 bg-yellow-600 text-white rounded-lg font-medium hover:bg-yellow-700 transition-colors shadow-sm cursor-pointer"
        >
          Confirmar
        </button>
      </div>

    </div>
  </div>
}
